        .author-profile { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border-soft); }

        .btn-share:active { transform: translateY(0); }

        .btn-card { background: var(--primary-color); color: white; }

<script>
    const palettes = {
        none:       { bg:'0,0,0', text:'#FFFFFF', author:'#E67E43', wm:'rgba(255,255,255,0.7)', accent:'#E67E43' },
        cream:      { bg:'253,251,244', text:'#33221A', author:'#E67E43', wm:'#686962', accent:'#E67E43' },
        dark:       { bg:'26,16,8', text:'#F5F0E8', author:'#E67E43', wm:'#857469', accent:'#E67E43' },
        terracotta: { bg:'192,86,33', text:'#FDFBF4', author:'#FDFBF4', wm:'rgba(255,255,255,0.5)', accent:'#FDFBF4' },
        sage:       { bg:'138,154,122', text:'#1C2416', author:'#FDFBF4', wm:'rgba(255,255,255,0.5)', accent:'#FDFBF4' },
        midnight:   { bg:'26,32,53', text:'#E8E0D0', author:'#E67E43', wm:'#6E7694', accent:'#E67E43' }
    };

    const dimensions = {
        insta_sq:  { w: 1080, h: 1080 },
        insta_st:  { w: 1080, h: 1920 },
        fb_post:   { w: 1200, h: 630 },
        pinterest: { w: 1000, h: 1500 }
    };

    let customUploadUrl = null;
    let activeFontFamily = 'system-ui, sans-serif';

    function updateOpacityDisplay() {
        const val = document.getElementById('overlayOpacity').value;
        document.getElementById('opacityValue').innerText = val + '%';
    }

    function updateFontSizeDisplay() {
        const val = document.getElementById('fontSizeScale').value;
        document.getElementById('fontSizeValue').innerText = val + '%';
    }

    function fetchAndApplyGoogleFont(fontName) {
        const fontSlug = fontName.replace(/\s+/g, '+');
        const linkId = 'gfont-' + fontName.replace(/\s+/g, '-').toLowerCase();

        if (!document.getElementById(linkId)) {
            const link = document.createElement('link');
            link.id = linkId;
            link.rel = 'stylesheet';
            link.href = `https://fonts.googleapis.com/css2?family=${fontSlug}:ital,wght@0,400;0,700;1,400;1,700&display=swap`;
            document.head.appendChild(link);
        }

        setFontStatus('loading', `Loading font "${fontName}"…`);

        document.fonts.load(`16px "${fontName}"`).then(() => {
            clearFontStatus();
            activeFontFamily = `"${fontName}", sans-serif`;
            drawCanvas();
        }).catch(() => {
            setFontStatus('error', `Couldn't load the font "${fontName}" — check the name/URL and try again.`);
            activeFontFamily = `"${fontName}", sans-serif`;
            drawCanvas();
        });
    }

    function handleFontChange() {
        const fontVal = document.getElementById('fontSelect').value;
        document.getElementById('fontUrlInput').value = '';

        if (fontVal.includes(',')) {
            activeFontFamily = fontVal;
            drawCanvas();
        } else {
            fetchAndApplyGoogleFont(fontVal);
        }
    }

    function loadCustomGoogleFont() {
        const rawUrl = document.getElementById('fontUrlInput').value.trim();
        if (!rawUrl) return;

        let fontName = '';

        if (rawUrl.includes('fonts.google.com/specimen/')) {
            const parts = rawUrl.split('/specimen/');
            if (parts[1]) {
                fontName = parts[1].split('?')[0].replace(/\+/g, ' ');
            }
        } else if (rawUrl.includes('family=')) {
            const match = rawUrl.match(/family=([^&:]+)/);
            if (match && match[1]) {
                fontName = match[1].replace(/\+/g, ' ');
            }
        } else {
            fontName = rawUrl;
        }

        if (fontName) {
            fetchAndApplyGoogleFont(fontName);
        }
    }

    document.getElementById('bgUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            customUploadUrl = URL.createObjectURL(file);
            drawCanvas();
        }
    });

    function handleDropdownChange() {
        document.getElementById('bgUpload').value = "";
        customUploadUrl = null;
        drawCanvas();
    }

    function drawImageCover(ctx, img, canvasWidth, canvasHeight) {
        const imgRatio = img.width / img.height;
        const canvasRatio = canvasWidth / canvasHeight;
        let drawWidth, drawHeight, offsetX, offsetY;

        if (imgRatio > canvasRatio) {
            drawHeight = canvasHeight;
            drawWidth = img.width * (canvasHeight / img.height);
            offsetX = (canvasWidth - drawWidth) / 2;
            offsetY = 0;
        } else {
            drawWidth = canvasWidth;
            drawHeight = img.height * (canvasWidth / img.width);
            offsetX = 0;
            offsetY = (canvasHeight - drawHeight) / 2;
        }
        ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
    }

    function drawDynamicText(ctx, text, x, y, maxWidth, maxHeight, fontTemplate, startFontSize, align) {
        let fontSize = startFontSize;
        let lines = [];
        let lineHeight;

        while (fontSize >= 24) {
            ctx.font = fontTemplate.replace('{size}', fontSize);
            lineHeight = fontSize * 1.4;
            lines = [];
            let words = text.split(' ');
            let line = '';

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    lines.push(line.trim());
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line.trim());

            if (lines.length * lineHeight <= maxHeight) break;
            fontSize -= 2;
        }

        ctx.textAlign = align;
        let startY = y - ((lines.length - 1) * lineHeight) / 2;
        for (let i = 0; i < lines.length; i++) {
            ctx.fillText(lines[i], x, startY + (i * lineHeight));
        }
        return startY + (lines.length * lineHeight);
    }

    function drawCanvas() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const quoteText = document.getElementById('quoteText').value.trim() || "Enter your quote...";
        const authorName = document.getElementById('authorName').value.trim();
        const dimKey = document.getElementById('dimensionSelect').value;
        const palKey = document.getElementById('paletteSelect').value;
        const layout = document.getElementById('layoutSelect').value;
        const bgSelect = document.getElementById('bgSelect').value;
        const urlInput = document.getElementById('urlInput').value.trim();
        const opacityPct = document.getElementById('overlayOpacity').value / 100;

        const dim = dimensions[dimKey];
        const palette = palettes[palKey] || palettes['none'];

        // Determine text color (Picker vs Palette default)
        const textColorMode = document.getElementById('textColorMode').value;
        const activeTextColor = textColorMode === 'custom' 
            ? document.getElementById('textColorPicker').value 
            : palette.text;
        
        canvas.width = dim.w;
        canvas.height = dim.h;

        let activeImageUrl = urlInput || customUploadUrl || bgSelect;
        const bgStatus = document.getElementById('bgStatus');

        if (activeImageUrl) {
            setBgStatus('loading', 'Loading background image…');
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = function() {
                clearBgStatus();
                drawImageCover(ctx, img, canvas.width, canvas.height);
                
                // Draw Overlay Color scaled by Opacity slider percentage
                ctx.fillStyle = `rgba(${palette.bg}, ${opacityPct})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                renderTextElements(ctx, canvas, quoteText, authorName, layout, palette, activeTextColor);
            };
            img.onerror = function() {
                // Most common cause: the source doesn't allow cross-origin loading,
                // which is required so the canvas can be exported/downloaded.
                if (urlInput) {
                    setBgStatus('error', "Couldn't load that image — the site it's hosted on doesn't allow it to be used here. Try uploading the image as a file instead.");
                } else {
                    setBgStatus('error', "Couldn't load that background image. Falling back to a solid color.");
                }
                ctx.fillStyle = '#222';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                renderTextElements(ctx, canvas, quoteText, authorName, layout, palette, activeTextColor);
            };
            img.src = activeImageUrl;
        } else {
            clearBgStatus();
        }
    }

    function setBgStatus(kind, message) {
        const bgStatus = document.getElementById('bgStatus');
        bgStatus.textContent = message;
        bgStatus.className = 'bg-status ' + (kind === 'loading' ? 'is-loading' : 'is-error');
        bgStatus.style.display = 'block';
    }

    function clearBgStatus() {
        const bgStatus = document.getElementById('bgStatus');
        bgStatus.style.display = 'none';
        bgStatus.textContent = '';
    }

    function setFontStatus(kind, message) {
        const fontStatus = document.getElementById('fontStatus');
        fontStatus.textContent = message;
        fontStatus.className = 'bg-status ' + (kind === 'loading' ? 'is-loading' : 'is-error');
        fontStatus.style.display = 'block';
    }

    function clearFontStatus() {
        const fontStatus = document.getElementById('fontStatus');
        fontStatus.style.display = 'none';
        fontStatus.textContent = '';
    }

    function renderTextElements(ctx, canvas, quoteText, authorName, layout, colors, textColor) {
        const fontSizeScale = document.getElementById('fontSizeScale').value / 100;
        const startFontSize = Math.floor(canvas.width * 0.08 * fontSizeScale); 
        const padding = canvas.width * 0.12;
        const maxWidth = canvas.width - (padding * 2);
        const maxTextHeight = canvas.height * 0.50; 
        let bottomOfTextY = 0;

        const authorGap = Math.max(30, canvas.height * 0.06);

        if (layout === 'minimalist') {
            ctx.fillStyle = textColor;
            bottomOfTextY = drawDynamicText(ctx, `"${quoteText}"`, canvas.width / 2, canvas.height / 2.2, maxWidth, maxTextHeight, `500 {size}px ${activeFontFamily}`, startFontSize, 'center');

            if (authorName) {
                ctx.fillStyle = colors.author;
                ctx.font = `600 ${startFontSize * 0.4}px ${activeFontFamily}`;
                ctx.fillText(`— ${authorName}`, canvas.width / 2, bottomOfTextY + authorGap); 
            }

        } else if (layout === 'bold') {
            ctx.font = `bold ${startFontSize * 5}px ${activeFontFamily}`;
            ctx.fillStyle = colors.accent;
            ctx.globalAlpha = 0.3;
            ctx.fillText('"', padding - 40, padding + (startFontSize * 2));
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = colors.accent;
            ctx.fillRect(padding - 40, canvas.height/4, 15, canvas.height/2);

            ctx.fillStyle = textColor;
            bottomOfTextY = drawDynamicText(ctx, quoteText, padding, canvas.height / 2.2, maxWidth, maxTextHeight, `bold {size}px ${activeFontFamily}`, startFontSize, 'left');

            if (authorName) {
                ctx.fillStyle = colors.author;
                ctx.font = `bold ${startFontSize * 0.45}px ${activeFontFamily}`;
                ctx.fillText(authorName.toUpperCase(), padding, bottomOfTextY + authorGap);
            }

        } else if (layout === 'elegant') {
            ctx.strokeStyle = colors.accent;
            ctx.lineWidth = 4;
            ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

            ctx.fillStyle = textColor;
            bottomOfTextY = drawDynamicText(ctx, `"${quoteText}"`, canvas.width / 2, canvas.height / 2.2, maxWidth, maxTextHeight, `italic {size}px ${activeFontFamily}`, startFontSize, 'center');
            
            if (authorName) {
                ctx.fillStyle = colors.author;
                ctx.font = `normal ${startFontSize * 0.4}px ${activeFontFamily}`;
                ctx.fillText(authorName, canvas.width / 2, bottomOfTextY + authorGap);
            }
        }

        ctx.textAlign = 'center';
        const wmSize = Math.max(16, Math.min(26, canvas.width * 0.022));
        ctx.font = `500 ${wmSize}px ${activeFontFamily}`;
        ctx.fillStyle = colors.wm;
        
        const watermarkBottomPadding = Math.max(30, canvas.height * 0.06);
        ctx.fillText("QUOTESTHATMATTER.COM", canvas.width / 2, canvas.height - watermarkBottomPadding);

        document.getElementById('previewImage').src = canvas.toDataURL('image/png');
    }

    function downloadImage() {
        const canvas = document.getElementById('canvas');
        const mimeType = document.getElementById('formatSelect').value;
        const ext = mimeType === 'image/png' ? 'png' : (mimeType === 'image/jpeg' ? 'jpg' : 'webp');
        const quality = mimeType === 'image/png' ? undefined : 0.92;

        try {
            canvas.toBlob(function(blob) {
                if (!blob) {
                    // Some older browsers (notably older Safari) don't support WebP export.
                    // Fall back to PNG so the download never silently fails.
                    canvas.toBlob(function(pngBlob) {
                        triggerDownload(pngBlob, 'quotesthatmatter.png');
                    }, 'image/png');
                    return;
                }
                triggerDownload(blob, `quotesthatmatter.${ext}`);
            }, mimeType, quality);
        } catch (err) {
            // Canvas is "tainted" by a cross-origin background image that loaded
            // but doesn't allow its pixels to be read back out for export.
            setBgStatus('error', "This image can't be downloaded because of how its source site restricts it. Try uploading it as a file instead, or pick a different background.");
        }
    }

    function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function prefillFromUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const quote = params.get('quote');
        const author = params.get('author');
        if (quote) document.getElementById('quoteText').value = quote;
        if (author) document.getElementById('authorName').value = author;
    }

    function saveFormatPreference() {
        try {
            localStorage.setItem('qtm_download_format', document.getElementById('formatSelect').value);
        } catch (e) {
            // localStorage unavailable (private browsing etc.) — not critical, just skip remembering.
        }
    }

    function restoreFormatPreference() {
        try {
            const saved = localStorage.getItem('qtm_download_format');
            if (saved) document.getElementById('formatSelect').value = saved;
        } catch (e) {
            // ignore
        }
    }

    window.onload = function() {
        restoreFormatPreference();
        prefillFromUrlParams();
        drawCanvas();
    };
</script>
</body>
</html>

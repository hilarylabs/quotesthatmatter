<script>
    const palettes = {
        cream:      { bg:'#FDFBF4', text:'#33221A', author:'#E67E43', wm:'#686962', accent:'#E67E43', overlay: 'rgba(253, 251, 244, 0.75)' },
        dark:       { bg:'#1a1008', text:'#F5F0E8', author:'#E67E43', wm:'#857469', accent:'#E67E43', overlay: 'rgba(26, 16, 8, 0.75)' },
        terracotta: { bg:'#C05621', text:'#FDFBF4', author:'#FDFBF4', wm:'rgba(255,255,255,0.5)', accent:'#FDFBF4', overlay: 'rgba(192, 86, 33, 0.75)' },
        sage:       { bg:'#8a9a7a', text:'#1C2416', author:'#FDFBF4', wm:'rgba(255,255,255,0.5)', accent:'#FDFBF4', overlay: 'rgba(138, 154, 122, 0.75)' },
        midnight:   { bg:'#1a2035', text:'#E8E0D0', author:'#E67E43', wm:'#6E7694', accent:'#E67E43', overlay: 'rgba(26, 32, 53, 0.75)' }
    };

    const dimensions = {
        insta_sq:  { w: 1080, h: 1080 },
        insta_st:  { w: 1080, h: 1920 },
        fb_post:   { w: 1200, h: 630 },
        pinterest: { w: 1000, h: 1500 }
    };

    let customUploadUrl = null;

    document.getElementById('bgUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('bgSelect').value = "none";
            customUploadUrl = URL.createObjectURL(file);
            drawCanvas();
        }
    });

    function handleDropdownChange() {
        document.getElementById('bgUpload').value = "";
        customUploadUrl = null;
        drawCanvas();
    }

    function drawImageCover(ctx, img, canvasWidth, canvasHeight) {
        const imgRatio = img.width / img.height;
        const canvasRatio = canvasWidth / canvasHeight;
        let drawWidth, drawHeight, offsetX, offsetY;

        if (imgRatio > canvasRatio) {
            drawHeight = canvasHeight;
            drawWidth = img.width * (canvasHeight / img.height);
            offsetX = (canvasWidth - drawWidth) / 2;
            offsetY = 0;
        } else {
            drawWidth = canvasWidth;
            drawHeight = img.height * (canvasWidth / img.width);
            offsetX = 0;
            offsetY = (canvasHeight - drawHeight) / 2;
        }
        ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
    }

    function drawDynamicText(ctx, text, x, y, maxWidth, maxHeight, fontTemplate, startFontSize, align) {
        let fontSize = startFontSize;
        let lines = [];
        let lineHeight;

        while (fontSize >= 24) {
            ctx.font = fontTemplate.replace('{size}', fontSize);
            lineHeight = fontSize * 1.4;
            lines = [];
            let words = text.split(' ');
            let line = '';

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    lines.push(line.trim());
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line.trim());

            if (lines.length * lineHeight <= maxHeight) break;
            fontSize -= 2;
        }

        ctx.textAlign = align;
        let startY = y - ((lines.length - 1) * lineHeight) / 2;
        for (let i = 0; i < lines.length; i++) {
            ctx.fillText(lines[i], x, startY + (i * lineHeight));
        }
        return startY + (lines.length * lineHeight);
    }

function drawCanvas() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    const quoteText = document.getElementById('quoteText').value.trim() || "Enter your quote...";
    const authorName = document.getElementById('authorName').value.trim();
    const dimKey = document.getElementById('dimensionSelect').value;
    const palKey = document.getElementById('paletteSelect').value;
    const layout = document.getElementById('layoutSelect').value;
    const bgSelect = document.getElementById('bgSelect').value;
    const urlInput = document.getElementById('urlInput').value.trim(); // New Input

    const dim = dimensions[dimKey];
    const colors = palettes[palKey];
    
    canvas.width = dim.w;
    canvas.height = dim.h;

    // PRIORITY ORDER: 1. Paste URL, 2. Uploaded, 3. Dropdown
    let activeImageUrl = urlInput || customUploadUrl;
    if (!activeImageUrl && bgSelect !== 'none') {
        activeImageUrl = bgSelect;
    }

    if (activeImageUrl) {
        const img = new Image();
        img.crossOrigin = "anonymous"; // This tries to bypass standard CORS blocks
        img.onload = function() {
            drawImageCover(ctx, img, canvas.width, canvas.height);
            ctx.fillStyle = colors.overlay;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            renderTextElements(ctx, canvas, quoteText, authorName, colors, layout);
        };
        img.onerror = function() {
            alert("Could not load image. The website might be blocking external access (CORS).");
        };
        img.src = activeImageUrl;
    } else {
        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        renderTextElements(ctx, canvas, quoteText, authorName, colors, layout);
    }
}

    function renderTextElements(ctx, canvas, quoteText, authorName, colors, layout) {
        const startFontSize = Math.floor(canvas.width * 0.08); 
        const padding = canvas.width * 0.12;
        const maxWidth = canvas.width - (padding * 2);
        
        // Slightly reduced max text height to leave more safe room for the author
        const maxTextHeight = canvas.height * 0.50; 
        let bottomOfTextY = 0;

        // NEW: Calculate dynamic gap so it scales well on short (FB) and tall (Story) posts
        const authorGap = Math.max(30, canvas.height * 0.06);

        if (layout === 'minimalist') {
            ctx.fillStyle = colors.text;
            bottomOfTextY = drawDynamicText(ctx, `"${quoteText}"`, canvas.width / 2, canvas.height / 2.2, maxWidth, maxTextHeight, `500 {size}px system-ui, sans-serif`, startFontSize, 'center');

            if (authorName) {
                ctx.fillStyle = colors.author;
                ctx.font = `600 ${startFontSize * 0.4}px system-ui, sans-serif`;
                ctx.fillText(`— ${authorName}`, canvas.width / 2, bottomOfTextY + authorGap); 
            }

        } else if (layout === 'bold') {
            ctx.font = `bold ${startFontSize * 5}px system-ui, sans-serif`;
            ctx.fillStyle = colors.accent;
            ctx.globalAlpha = 0.15;
            ctx.fillText('"', padding - 40, padding + (startFontSize * 2));
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = colors.accent;
            ctx.fillRect(padding - 40, canvas.height/4, 15, canvas.height/2);

            ctx.fillStyle = colors.text;
            bottomOfTextY = drawDynamicText(ctx, quoteText, padding, canvas.height / 2.2, maxWidth, maxTextHeight, `bold {size}px system-ui, sans-serif`, startFontSize, 'left');

            if (authorName) {
                ctx.fillStyle = colors.author;
                ctx.font = `bold ${startFontSize * 0.45}px system-ui, sans-serif`;
                ctx.fillText(authorName.toUpperCase(), padding, bottomOfTextY + authorGap);
            }

        } else if (layout === 'elegant') {
            ctx.strokeStyle = colors.accent;
            ctx.lineWidth = 4;
            ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

            ctx.fillStyle = colors.text;
            bottomOfTextY = drawDynamicText(ctx, `"${quoteText}"`, canvas.width / 2, canvas.height / 2.2, maxWidth, maxTextHeight, `italic {size}px Georgia, serif`, startFontSize, 'center');
            
            if (authorName) {
                ctx.fillStyle = colors.author;
                ctx.font = `normal ${startFontSize * 0.4}px Georgia, serif`;
                ctx.fillText(authorName, canvas.width / 2, bottomOfTextY + authorGap);
            }
        }

        ctx.textAlign = 'center';
        // Make sure watermark font size doesn't get too big on wide screens
        const wmSize = Math.max(16, Math.min(26, canvas.width * 0.022));
        ctx.font = `500 ${wmSize}px system-ui, sans-serif`;
        ctx.fillStyle = colors.wm;
        
        // NEW: Anchor the watermark to the bottom edge using canvas.height math
        const watermarkBottomPadding = Math.max(30, canvas.height * 0.06);
        ctx.fillText("QUOTESTHATMATTER.COM", canvas.width / 2, canvas.height - watermarkBottomPadding);

        const dataUrl = canvas.toDataURL('image/png');
        document.getElementById('previewImage').src = dataUrl;
        document.getElementById('downloadBtn').href = dataUrl;
    }

    window.onload = drawCanvas;

</script>
